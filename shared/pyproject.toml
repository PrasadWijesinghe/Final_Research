[project]
name = "pipelineiq-shared"
version = "0.1.0"
description = "Shared contracts and helpers (DB, GitHub client, sanitiser, embeddings)."
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "cryptography>=43",
    "detect-secrets>=1.5.0",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.7",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.1.4",
]

[project.optional-dependencies]
embeddings = [
    "sentence-transformers>=3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# DEFAULT: the package folder is ./shared (import name `shared`) and holds its own pyproject.toml,
# so the wheel maps this whole folder to `shared/` (force-include) and editable installs put the
# parent directory on sys.path (dev-mode-dirs), which makes `import shared` resolve to this folder.
# This avoids moving any file in shared/contracts/.
[tool.hatch.build.targets.wheel]
bypass-selection = true
dev-mode-dirs = [".."]

[tool.hatch.build.targets.wheel.force-include]
"." = "shared"

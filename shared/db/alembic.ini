[alembic]
# %(here)s is the folder holding this file (shared/db), so this works from any working directory.
script_location = %(here)s/migrations
# The database URL is NOT set here: env.py reads DATABASE_URL.

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Throwaway password, read by docker compose and by the tests.
      POSTGRES_PASSWORD: ci-test-password
      DATABASE_URL: postgresql+psycopg://pipelineiq:ci-test-password@127.0.0.1:5432/pipelineiq
      REDIS_URL: redis://127.0.0.1:6379/0
      IDENTITY_SALT: ci-test-salt
      LLM_PROVIDER: mock
      REQUIRE_NODE: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # Node 22 for the pre-push hook tests (P3.4); `make check` runs them via `check-hook`.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Same stack as local development (`make up`), so the init script is tested too.
      - name: Start Postgres and Redis
        run: make up

      # uv reads .python-version (3.12) and installs that interpreter.
      - name: Install dependencies
        run: uv sync --all-packages --locked

      # Same command as local development, so CI and laptops never diverge:
      # ruff check, ruff format --check, mypy, pytest.
      - name: make check
        run: make check

      # End-to-end (P2.9): builds the api and Test-expert images, migrates, runs `pytest -m e2e`
      # and tears the stack down; it prints the compose logs itself when the test fails.
      - name: End-to-end test
        timeout-minutes: 15
        run: make e2e

      - name: Stack logs on failure
        if: failure()
        run: docker compose --profile e2e --profile experts logs --no-color

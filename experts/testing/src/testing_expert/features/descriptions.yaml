rs_runner_os:
  template: "The job runs on {value}"
  missing: "The runner operating system is unknown"
rs_matrix_size:
  template: "The job is one of {value} matrix variants in this run"
rs_jobs_in_run:
  template: "The workflow run has {value} jobs"
rs_is_pull_request:
  template: "The run was triggered by a pull request (flag {value}: 1 = yes)"
rs_event:
  template: "The run was triggered by a {value} event"
  missing: "The trigger event is unknown"
rs_on_default_branch:
  template: "The run is on the default branch (flag {value}: 1 = yes)"
  missing: "The branch is unknown"
rs_attempt:
  template: "This is attempt number {value} of the run"
rp_avg_test_job_minutes:
  template: "Test jobs in this repository take {value:.0f} minutes on average"
  missing: "No recent test-job durations for this repository"
rp_test_jobs_in_window:
  template: "{value} test jobs finished in this repository in the last 90 days"
rp_framework:
  template: "The repository uses {value} for tests"
  missing: "The test framework is unknown"
ht_test_level:
  template: "This job's logs list individual tests (flag {value}: 1 = test level, 0 = file level)"
  missing: "No earlier test results are known for this job"
ht_parsed_runs_30d:
  template: "{value} earlier runs of this job with readable test results in the last 30 days"
ht_parsed_runs_90d:
  template: "{value} earlier runs of this job with readable test results in the last 90 days"
ht_last_run_failed_tests:
  template: "{value} tests failed in the job's most recent earlier run"
  missing: "No earlier test results are known for this job"
ht_persistent_failing_tests:
  template: "{value} tests failed in both of the job's last two runs"
  missing: "No earlier test results are known for this job"
ht_failed_tests_30d:
  template: "{value} different tests failed in this job in the last 30 days"
ht_failed_tests_90d:
  template: "{value} different tests failed in this job in the last 90 days"
ht_flaky_tests_30d:
  template: "{value} tests both failed and passed in this job in the last 30 days"
ht_flaky_tests_90d:
  template: "{value} tests both failed and passed in this job in the last 90 days"
ht_touched_test_files:
  template: "The commit changes {value} test files"
ht_touched_files_with_history:
  template: "{value} of the changed test files have earlier results in this job"
  missing: "The changed test files have no earlier results in this job"
ht_touched_fail_rate:
  template: "The changed test files failed in {value:.0%} of their earlier runs"
  missing: "The changed test files have no earlier results in this job"
ht_touched_max_flip_rate:

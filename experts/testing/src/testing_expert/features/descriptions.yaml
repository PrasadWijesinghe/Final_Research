tw_timeout_changes:
  template: "The commit adds or changes {value} test timeouts"
  missing: "The test-file diff for this commit is not available"
tw_only_added:
  template: "The commit adds {value} .only markers (only some tests would run)"
  missing: "The test-file diff for this commit is not available"
tw_skip_added:
  template: "The commit adds {value} skipped tests"
  missing: "The test-file diff for this commit is not available"
tw_file_level_state:
  template: "The commit adds {value} file-level variables that tests can share and change"
  missing: "The test-file diff for this commit is not available"
tw_missing_cleanup:

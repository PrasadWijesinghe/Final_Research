  missing: "The test-file diff for this commit is not available"
tw_set_timeout:
  template: "The commit adds {value} setTimeout or setInterval calls in test files"
  missing: "The test-file diff for this commit is not available"
tw_real_timers:
  template: "The commit switches back to real timers {value} times in test files"
  missing: "The test-file diff for this commit is not available"
tw_date_now:
  template: "The commit adds {value} reads of the current time (Date.now() or new Date()) in test files"
  missing: "The test-file diff for this commit is not available"
tw_math_random:

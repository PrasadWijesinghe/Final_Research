[project]
name = "pipelineiq-expert-testing"
version = "0.1.0"
description = "The test expert: /predict, /review, /health and a diagnose worker (stub behaviour)."
requires-python = ">=3.12"
dependencies = [
    "pipelineiq-shared",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "rq>=2.0",
    "redis>=5",
    "httpx>=0.28.1",
    "pydantic>=2.7",
    "sqlalchemy>=2.1.4",
    "pyyaml>=6.0.3",
    "lightgbm>=4.7.0",
    "scikit-learn>=1.9.1",
    "mlflow>=3.17.2",
    "pandas>=3.1.0",
    "pyarrow>=25.0.1",
    "joblib>=1.6.0",
    "tree-sitter==0.25.2",
    "tree-sitter-javascript>=0.25.0",
    "tree-sitter-typescript>=0.23.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/testing_expert"]

[tool.uv.sources]
pipelineiq-shared = { workspace = true }

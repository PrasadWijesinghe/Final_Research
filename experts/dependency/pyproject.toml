[project]
name = "pipelineiq-expert-dependency"
version = "0.1.0"
description = "The dependency expert: /predict, /review, /health and a diagnose worker (stub behaviour)."
requires-python = ">=3.12"
dependencies = [
    "pipelineiq-shared",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "rq>=2.0",
    "redis>=5",
    "httpx>=0.28.1",
    "pydantic>=2.7",
    "sqlalchemy>=2.1.4",
    "PyYAML>=6.0.2",
]

[project.optional-dependencies]
prototype = [
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "shap>=0.46",
    "xgboost>=2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dependency_expert"]

[tool.uv.sources]
pipelineiq-shared = { workspace = true }

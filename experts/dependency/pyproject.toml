[project]
name = "pipelineiq-expert-dependency"
version = "0.1.0"
description = "The dependency expert: /predict, /review, /health and a diagnose worker (stub behaviour)."
requires-python = ">=3.12"
dependencies = [
    "pipelineiq-shared",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "rq>=2.0",
    "redis>=5",
    "httpx>=0.28.1",
    "pydantic>=2.7",
    "sqlalchemy>=2.1.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dependency_expert"]

[tool.uv.sources]
pipelineiq-shared = { workspace = true }

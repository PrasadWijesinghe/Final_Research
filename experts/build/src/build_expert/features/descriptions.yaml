# Plain-language templates for each feature, used later to turn SHAP values into RiskFactor
# reasons (docs/experts/build.md section 6). `{value}` is the feature's value for the commit.
# Phrase them as risk factors, never as causes. A test checks every feature has an entry.

# --- A. What the code change looks like
n_files: "{value} files changed"
n_source_files: "{value} source files changed"
n_ts_files: "{value} TypeScript files changed"
n_js_files: "{value} JavaScript files changed"
n_test_files: "{value} test files changed"
n_declaration_files: "{value} type declaration (.d.ts) files changed"
n_build_config_files: "{value} tsconfig or Babel config files changed"
n_lint_config_files: "{value} ESLint or Prettier config files changed"
n_bundler_config_files: "{value} bundler config files changed"
n_docs_files: "{value} documentation files changed"
lines_added: "{value} lines added"
lines_deleted: "{value} lines deleted"
source_lines_added: "{value} source lines added"
source_lines_deleted: "{value} source lines deleted"
max_file_churn: "the most-changed file has {value} changed lines"
n_added_files: "{value} new files"
n_removed_files: "{value} files deleted"
n_renamed_files: "{value} files renamed"
n_removed_or_renamed_source: "{value} source files deleted or renamed, which can break imports"
n_module_dirs: "the change spans {value} packages or top-level folders"
docs_only: "only documentation changed"
tests_only: "only tests changed"
patches_missing: "{value} changed code files have no diff (too large or binary)"
truncated: "the diff was too large and was cut"
imports_added: "{value} import lines added"
imports_removed: "{value} import lines removed"
exports_added: "{value} export lines added"
exports_removed: "{value} export lines removed, which can break code that uses them"
type_decls_changed: "{value} interface, type or enum declarations changed"
annotations_added: "{value} lines with new type annotations"
any_added: "{value} new uses of `any`"
ts_suppressions_added: "{value} new @ts-ignore or @ts-expect-error comments"
ts_suppressions_removed: "{value} @ts-ignore or @ts-expect-error comments removed"
eslint_disables_added: "{value} new eslint-disable comments"
eslint_disables_removed: "{value} eslint-disable comments removed"
console_calls_added: "{value} new console calls"
non_null_assertions_added: "{value} new non-null assertions (!)"

# --- B. Build-tool configuration changes
tsconfig_changed: "{value} tsconfig files changed"
tsconfig_added: "{value} new tsconfig files"
tsconfig_strictness_lines: "{value} strictness settings changed in tsconfig"
tsconfig_target_module_lines: "{value} target/module/lib settings changed in tsconfig"
tsconfig_paths_lines: "{value} path or output settings changed in tsconfig"
tsconfig_include_lines: "{value} include/exclude/references settings changed in tsconfig"
babel_config_changed: "{value} Babel config files changed"
eslint_config_changed: "{value} ESLint config files changed"
eslint_severity_lines: "{value} ESLint rule severities changed"
eslint_rules_set_to_error: "{value} ESLint rules set to error"
eslint_extends_plugins_lines: "{value} ESLint plugin, parser or shared-config lines changed"
prettier_config_changed: "{value} Prettier config files changed"
bundler_config_changed: "{value} bundler config files changed"
bundler_option_lines: "{value} bundler options (plugins, entry, resolve) changed"
package_json_changed: "{value} package.json files changed"
build_script_lines: "{value} build, lint or type-check scripts changed in package.json"
build_tool_dep_lines: "{value} build-tool dependency versions changed (TypeScript, ESLint, bundlers)"
typescript_version_changed: "the TypeScript version changed"
types_dep_lines: "{value} @types packages changed"
module_field_lines: "{value} module settings changed in package.json (type, exports, main)"
engines_lines: "{value} Node engine or package-manager settings changed"
lockfile_changed: "{value} lockfiles changed"
workflow_changed: "{value} CI workflow files changed"
workflow_node_version_lines: "{value} Node version lines changed in CI workflows"
node_version_file_changed: "the .nvmrc or .node-version file changed"
config_patches_missing: "{value} changed config files have no diff"

# --- C. CI environment
n_workflow_jobs: "CI has {value} jobs for this commit"
n_node_versions: "CI builds on {value} Node versions"
node_major_min: "the oldest Node version in CI is {value}"
node_major_max: "the newest Node version in CI is {value}"
node_version_unresolved: "{value} Node versions in CI could not be read"
runs_on_windows: "CI also builds on Windows"
runs_on_macos: "CI also builds on macOS"
package_manager: "the package manager is {value}"
uses_monorepo_runner: "CI uses a monorepo task runner (turbo, nx, pnpm -r)"
ci_has_typecheck: "CI runs a type check"
ci_has_lint: "CI runs a linter"
ci_has_format_check: "CI runs a format check"
ci_has_bundle: "CI runs a build or bundle step"
is_pull_request: "this is a pull request"
is_default_branch: "this is the default branch"
is_bot_branch: "this branch comes from a dependency bot"

# --- D. History before this commit
repo_build_fail_rate_7d: "{value} of commits in the last 7 days failed to build"
repo_build_fail_rate_30d: "{value} of commits in the last 30 days failed to build"
repo_build_fail_rate_90d: "{value} of commits in the last 90 days failed to build"
repo_commits_30d: "{value} commits in the last 30 days"
repo_tsc_fail_rate_30d: "{value} of recent commits had type errors"
repo_lint_fail_rate_30d: "{value} of recent commits had lint or format errors"
repo_bundler_fail_rate_30d: "{value} of recent commits had bundler errors"
repo_any_fail_rate_30d: "{value} of recent commits failed CI for any reason"
branch_has_history: "this branch has earlier CI runs"
branch_last_build_failed: "the previous build on this branch failed"
branch_consecutive_build_fails: "the last {value} build(s) on this branch failed in a row"
hours_since_branch_build_fail: "the last build failure on this branch was {value} hours ago"
author_commits_90d: "the author has {value} commits in the last 90 days"
author_build_fail_rate_90d: "{value} of this author's recent commits failed to build"
author_last_build_failed: "this author's previous commit failed to build"
dirs_commits_30d: "{value} recent commits touched the same packages"
dirs_build_fail_rate_30d: "{value} of recent commits in the same packages failed to build"
last_lint_warnings: "the last run on this branch had {value} ESLint warnings"
last_type_errors: "the last run on this branch had {value} type errors"
lint_warnings_trend: "ESLint warnings changed by {value} between the last two runs"

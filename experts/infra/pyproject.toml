[project]
name = "pipelineiq-expert-infra"
version = "0.1.0"
description = "Infrastructure failure-risk expert with a calibrated research model."
requires-python = ">=3.12"
dependencies = [
    "pipelineiq-shared",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "rq>=2.0",
    "redis>=5",
    "httpx>=0.28.1",
    "pydantic>=2.7",
    "sqlalchemy>=2.1.4",
    "joblib>=1.6",
    "numpy>=2.5",
    "pandas>=3.1",
    "scikit-learn>=1.9",
    # DEFAULT: CPU-only wheels on common x86-64 hosts; the full package covers other platforms.
    "xgboost-cpu==3.4.1; (platform_system == 'Windows' and platform_machine == 'AMD64') or (platform_system == 'Linux' and platform_machine == 'x86_64')",
    "xgboost==3.4.1; (platform_system != 'Windows' or platform_machine != 'AMD64') and (platform_system != 'Linux' or platform_machine != 'x86_64')",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/infra_expert"]

[tool.uv.sources]
pipelineiq-shared = { workspace = true }

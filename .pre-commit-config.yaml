repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # DEFAULT: the real log fixtures keep their trailing spaces and Windows line endings on
      # purpose (the cleaner is tested on them), so the whitespace fixers skip that folder.
      - id: end-of-file-fixer
        exclude: ^experts/testing/tests/fixtures/logs/
      - id: trailing-whitespace
        exclude: ^experts/testing/tests/fixtures/logs/
  # DEFAULT: ruff and mypy run from the uv environment (language: system) so their versions
  # always match uv.lock and `make check`, and mypy sees the Pydantic plugin and workspace
  # packages. Pre-commit passes only the changed files.
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff-format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types: [python]
        require_serial: true

[project]
name = "pipelineiq-collector"
version = "0.1.0"
description = "GitHub Actions data collector: repo config, workflow detection, backfill and daily sync."
requires-python = ">=3.12"
dependencies = [
    "pipelineiq-shared",
    "pydantic>=2.7",
    "pyyaml>=6",
    "sqlalchemy>=2.1.4",
]

[project.scripts]
collector = "collector.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/collector"]

[tool.uv.sources]
pipelineiq-shared = { workspace = true }

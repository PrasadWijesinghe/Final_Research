name: Integration
on:
  workflow_dispatch:
jobs:
  integration:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - name: Mocha
        run: ./node_modules/.bin/mocha --exit test/*/*.js

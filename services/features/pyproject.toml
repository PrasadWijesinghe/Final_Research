[project]
name = "pipelineiq-features"
version = "0.1.0"
description = "Feature service: file tagging, CommitContext builders and replay."
requires-python = ">=3.12"
dependencies = [
    "pipelineiq-shared",
    "pydantic>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/features"]

[tool.uv.sources]
pipelineiq-shared = { workspace = true }

[project]
name = "pipelineiq-api"
version = "0.1.0"
description = "Backend API: pre-push predictions, diagnoses, reviews, API keys and history."
requires-python = ">=3.12"
dependencies = [
    "pipelineiq-shared",
    "pipelineiq-features",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "sqlalchemy>=2.1.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api"]

[tool.uv.sources]
pipelineiq-shared = { workspace = true }
pipelineiq-features = { workspace = true }

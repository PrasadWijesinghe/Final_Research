server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # DEFAULT: resolve upstream names at request time (Docker DNS), so the dashboard still starts
    # when the api or infra-api container is not running.
    resolver 127.0.0.11 valid=10s;

    # Main PipelineIQ API (services/api, port 8000). The /api prefix is stripped.
    location /api/ {
        set $pq_api http://api:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $pq_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Infra demo page only: talks to the Infra expert directly.
    location /infra-api/ {
        set $pq_infra http://infra-api:8104;
        rewrite ^/infra-api/(.*)$ /$1 break;
        proxy_pass $pq_infra;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

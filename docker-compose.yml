# Local stack: Postgres (with pgvector) and Redis, plus the four experts (profile "experts").
# Values come from .env; the defaults after ":-" match .env.example so `make up` also works
# on a fresh clone with no .env. DEFAULT: defaults mirror .env.example (no .env needed to start).
name: pipelineiq

# Shared settings for the expert services (YAML anchors; Compose ignores "x-" keys).
x-expert-env: &expert-env
  # Inside the Compose network the services are reached by name, not 127.0.0.1.
  REDIS_URL: redis://redis:6379/0
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-pipelineiq}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-pipelineiq}
  # DEFAULT: empty, so stub workers just return their diagnosis; `make e2e` sets EXPERT_BACKEND_URL.
  BACKEND_URL: ""
  BACKEND_TIMEOUT_SECONDS: "${BACKEND_TIMEOUT_SECONDS:-10}"

x-expert-api: &expert-api
  profiles: ["experts"]
  depends_on:
    redis: { condition: service_healthy }
    postgres: { condition: service_healthy }
  restart: unless-stopped

x-expert-worker: &expert-worker
  profiles: ["experts"]
  environment: *expert-env
  restart: unless-stopped

services:
  postgres:
    # DEFAULT: pgvector 0.8.1 on PG 17 (latest 0.8.x at the time of writing); pinned, not a moving tag.
    image: pgvector/pgvector:0.8.1-pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pipelineiq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-pipelineiq}
    ports:
      # DEFAULT: bound to 127.0.0.1 so the database is not reachable from the LAN.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    # DEFAULT: Redis 7.4.6 (latest 7.4.x patch); pinned, not a moving tag.
    image: redis:7.4.6
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # --- Backend API (P2.9): only in the "e2e" profile for now; `make e2e` builds and starts it. ---
  api:
    profiles: ["e2e"]
    build: { context: ., dockerfile: services/api/Dockerfile }
    image: pipelineiq-api
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-pipelineiq}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-pipelineiq}
      REDIS_URL: redis://redis:6379/0
      API_PORT: "8000"
      # Experts are reached by service name inside the Compose network.
      EXPERT_DEPENDENCY_URL: http://dependency-api:8101
      EXPERT_BUILD_URL: http://build-api:8102
      EXPERT_TEST_URL: http://testing-api:8103
      EXPERT_INFRA_URL: http://infra-api:8104
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      # DEFAULT: python (always in the image) instead of curl; /health answers 200 even when experts are down.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)"]
      interval: 5s
      timeout: 6s
      retries: 12

  # --- Experts (P2.1): an API and a diagnose worker each, built from the repo root. -----------
  # DEFAULT: all expert services are in the "experts" profile, so plain `make up` still starts
  # only Postgres and Redis (light on laptops); `make up-experts` starts everything.
  dependency-api:
    <<: *expert-api
    build: { context: ., dockerfile: experts/dependency/Dockerfile }
    image: pipelineiq-expert-dependency
    environment: { <<: *expert-env, EXPERT_PORT: "8101" }
    ports: ["127.0.0.1:8101:8101"]

  dependency-worker:
    <<: *expert-worker
    image: pipelineiq-expert-dependency
    command: ["python", "-m", "dependency_expert.worker"]
    depends_on: { redis: { condition: service_healthy }, dependency-api: { condition: service_started } }

  build-api:
    <<: *expert-api
    build: { context: ., dockerfile: experts/build/Dockerfile }
    image: pipelineiq-expert-build
    environment: { <<: *expert-env, EXPERT_PORT: "8102" }
    ports: ["127.0.0.1:8102:8102"]

  build-worker:
    <<: *expert-worker
    image: pipelineiq-expert-build
    command: ["python", "-m", "build_expert.worker"]
    depends_on: { redis: { condition: service_healthy }, build-api: { condition: service_started } }

  testing-api:
    <<: *expert-api
    # DEFAULT: the Test expert (API + worker) also belongs to the "e2e" profile (P2.9), so the
    # end-to-end stack is only postgres, redis, api, testing-api and testing-worker.
    profiles: ["experts", "e2e"]
    build: { context: ., dockerfile: experts/testing/Dockerfile }
    image: pipelineiq-expert-testing
    # DEFAULT (P4.12): the trained model and the feature config are mounted read-only, not baked
    # into the image. TESTING_MODEL_BUNDLE names a folder of versions (newest v<N> is served); the
    # stub answers only when no bundle can be loaded. GET /status says which parts are real.
    environment:
      <<: *expert-env
      EXPERT_PORT: "8103"
      TESTING_MODEL_BUNDLE: /models/testing
      TEST_FEATURES_FILE: /app/config/test_features.yaml
      TEST_LOG_PARSING_FILE: /app/config/test_log_parsing.yaml
    volumes:
      - ./models:/models:ro
      - ./config:/app/config:ro
    ports: ["127.0.0.1:8103:8103"]

  testing-worker:
    <<: *expert-worker
    profiles: ["experts", "e2e"]
    # P4.12: the worker is the real thing by default: triage + knowledge base + the LLM gateway.
    # DEFAULT: BACKEND_URL is where the diagnosis is posted (the backend API is the one place the
    # dashboard reads). EXPERT_BACKEND_URL unset means http://host.docker.internal:8000, the API
    # running on the host (`uv run --env-file .env uvicorn api.app:app`, on Linux add `--host
    # 0.0.0.0`); `make e2e` sets it to http://api:8000 (the api container). Set it to an empty
    # string to post nowhere (the old stub behaviour). `-` not `:-` so empty stays empty.
    environment:
      <<: *expert-env
      BACKEND_URL: "${EXPERT_BACKEND_URL-http://host.docker.internal:8000}"
      TESTING_TRIAGE_BUNDLE: /models/testing/triage
      # DEFAULT (P4.10): the knowledge base is read from the same database. The image has no torch,
      # so retrieval here is full-text only (a missing embedding model is logged and skipped); this
      # keeps the image small. For vector retrieval build the image with sentence-transformers and
      # mount a model cache (see experts/testing/README.md, "Knowledge base").
      TEST_KB_FILE: /app/config/test_kb.yaml
      # Without these two files the parser and the feature code fall back (the log cleaner then
      # warns "parsing config not loaded" and triage runs on uncleaned text).
      TEST_LOG_PARSING_FILE: /app/config/test_log_parsing.yaml
      TEST_FEATURES_FILE: /app/config/test_features.yaml
      # P4.11/P4.12: the diagnosis step calls the LLM gateway service below (mock provider by
      # default, so the text comes from the template). Set EXPERT_LLM_GATEWAY_URL to point at
      # another gateway, or to an empty string for the template only. The sanitiser needs its
      # pattern file, or the prompt cannot be built (then the template is used).
      LLM_GATEWAY_URL: "${EXPERT_LLM_GATEWAY_URL-http://llm-gateway:8200}"
      TEST_DIAGNOSIS_FILE: /app/config/test_diagnosis.yaml
      SANITISE_PATTERNS_FILE: /app/config/sanitise_patterns.yaml
      # DEFAULT: the stored logs (data/logs, read-only) let triage read the full sanitised log
      # instead of the router's 20,000-character excerpt. log_ref is "logs/<owner>/<repo>/...".
      DATA_DIR: /data
    volumes:
      - ./models:/models:ro
      - ./config:/app/config:ro
      - ./data/logs:/data/logs:ro
    # DEFAULT: makes host.docker.internal resolve on Linux too (Docker Desktop already does).
    extra_hosts: ["host.docker.internal:host-gateway"]
    image: pipelineiq-expert-testing
    command: ["python", "-m", "testing_expert.worker"]
    depends_on:
      redis: { condition: service_healthy }
      testing-api: { condition: service_started }
      llm-gateway: { condition: service_healthy }

  # --- LLM gateway (P2.4, in compose since P4.12): the one door to the language model. ----------
  # DEFAULT: mock provider (placeholder answers, nothing leaves the machine). For DeepSeek set
  # LLM_PROVIDER=deepseek and LLM_API_KEY in .env (services/llm_gateway/README.md). LLM_API_KEY is
  # passed through empty and never logged; LLM_BASE_URL empty means the provider's own address.
  llm-gateway:
    profiles: ["experts", "e2e"]
    build: { context: ., dockerfile: services/llm_gateway/Dockerfile }
    image: pipelineiq-llm-gateway
    environment:
      LLM_PROVIDER: "${LLM_PROVIDER:-mock}"
      LLM_API_KEY: "${LLM_API_KEY:-}"
      LLM_BASE_URL: "${LLM_BASE_URL:-}"
      LLM_MODEL: "${LLM_MODEL:-}"
      LLM_CONFIG_FILE: /app/config/llm.yaml
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-pipelineiq}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-pipelineiq}
    volumes:
      - ./config:/app/config:ro
    ports:
      # DEFAULT: bound to 127.0.0.1; the gateway has no login and holds the model key.
      - "127.0.0.1:${LLM_GATEWAY_PORT:-8200}:8200"
    depends_on:
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }
    healthcheck:
      # DEFAULT: python (always in the image) instead of curl.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8200/health', timeout=4)"]
      interval: 5s
      timeout: 6s
      retries: 12
    restart: unless-stopped

  infra-api:
    <<: *expert-api
    build: { context: ., dockerfile: experts/infra/Dockerfile }
    image: pipelineiq-expert-infra
    environment: { <<: *expert-env, EXPERT_PORT: "8104" }
    ports: ["127.0.0.1:8104:8104"]

  infra-worker:
    <<: *expert-worker
    image: pipelineiq-expert-infra
    command: ["python", "-m", "infra_expert.worker"]
    depends_on: { redis: { condition: service_healthy }, infra-api: { condition: service_started } }

  dashboard:
    profiles: ["experts"]
    build: { context: ./services/dashboard, dockerfile: Dockerfile }
    image: pipelineiq-dashboard
    ports: ["127.0.0.1:3000:80"]
    depends_on: { infra-api: { condition: service_started } }
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:

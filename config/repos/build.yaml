  # --- Reserves: valuable but slow (add after the first backfill finishes)
  - {full_name: vercel/ai,                         licence: Apache-2.0,   group: library, builds: ">=2582", p1_hours: 2.6, log_hours: 20.5, enabled: false, note: "most build failures of all, but >20 h of failed logs (many jobs per run); GitHub reports NOASSERTION, LICENSE file is Apache-2.0"}

  # --- Reserves: the screen found no build-type failed steps in 12 recent failures. Repos that

# Member 2 — Build & Code Quality expert (C2).
# Candidates chosen 22 Oct 2026 from 80 Node.js repos by a static screen (workflow files,
# scripts, licence and git history read through git; see docs/experts/build.md section 2):
#   - TypeScript-heavy (ts_share = share of .ts/.tsx among JS/TS files)
#   - at least one workflow the build detection rule keeps, triggered on pull requests
#   - permissive licence (MIT, Apache-2.0, BSD); licence-risky repos are research-only
# Trimmed 27 Oct 2026 with the build screen (scripts/build_screen.py, real 90-day counts):
#   builds = estimated failed runs with a build-type failure in 90 days ("≥" = at least),
#   p1_hours = pass 1 time with one token, log_hours = failed-log download time in one lane.
# Re-run the screen before adding a reserve. Collect with `--logs failed` (backfill and daily)
# and fetch passing logs later with `collector fill-logs` (D38, D42).
member: build

repos:
  # --- Libraries and frameworks (4)
  - {full_name: prisma/prisma,                     licence: Apache-2.0,   group: library, builds: 742,   p1_hours: 2.2, log_hours: 1.5, note: "many lint:* scripts"}
  - {full_name: nrwl/nx,                           licence: MIT,          group: library, builds: ">=3857", p1_hours: 2.0, log_hours: 2.7, note: "nx affected lint/build/format"}
  - {full_name: langchain-ai/langchainjs,          licence: MIT,          group: library, builds: ">=1257", p1_hours: 4.7, log_hours: 2.4, note: "13 build workflows; many outside contributors"}
  - {full_name: open-telemetry/opentelemetry-js,   licence: Apache-2.0,   group: library, builds: 67,    p1_hours: 2.1, log_hours: 1.0, note: "npm run compile / lint"}

  # --- Applications and monorepos (5)
  - {full_name: backstage/backstage,               licence: Apache-2.0,   group: app,     builds: ">=1187", p1_hours: 1.6, log_hours: 2.3, note: "262 lint configs; yarn lint/build"}
  - {full_name: freeCodeCamp/freeCodeCamp,         licence: BSD-3-Clause, group: app,     builds: 901,   p1_hours: 1.6, log_hours: 1.1, note: "many first-time contributors; lint + prettier --check"}
  - {full_name: payloadcms/payload,                licence: MIT,          group: app,     builds: ">=1777", p1_hours: 1.2, log_hours: 4.0, note: "format:check, lint, build:all"}
  - {full_name: bluesky-social/social-app,         licence: MIT,          group: app,     builds: ">=600", p1_hours: 0.2, log_hours: 0.4, note: "busy repo, but only ~2% of runs are build workflows; lint, prettier, typecheck"}
  - {full_name: shadcn-ui/ui,                      licence: MIT,          group: app,     builds: 915,   p1_hours: 1.3, log_hours: 7.0, note: "many outside PRs; format:check, lint, typecheck"}

  # --- Bundler and build-tool heavy (2)
  - {full_name: vitejs/vite,                       licence: MIT,          group: bundler, builds: 365,   p1_hours: 1.7, log_hours: 0.8, note: "the bundler itself; also on the Test list"}

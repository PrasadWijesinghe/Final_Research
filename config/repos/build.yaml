# Member 2 — Build & Code Quality expert (C2).
# Selected 22 Oct 2026 from 80 Node.js candidates by a static screen (workflow files, scripts,
# licence and git history read through git; see docs/experts/build.md section 2):
#   - TypeScript-heavy (ts_share = share of .ts/.tsx among JS/TS files)
#   - at least one workflow the build detection rule keeps, triggered on pull requests
#   - permissive licence (MIT, Apache-2.0, BSD); licence-risky repos are research-only
#   - active: commits_90d = commits on the default branch since 24 Jul 2026 (rough evidence of
#     CI volume; PR runs come on top)
# Nobody has confirmed failure counts yet. Run `uv run --env-file .env python
# scripts/build_screen.py` with your token first: it counts real 90-day build/lint failures and
# estimates the backfill time per repo. Drop or reserve repos it shows as too quiet or too
# expensive. Licences are best-known values; the screen checks them against GitHub.
# Collect with `--logs failed` (backfill and daily) and fetch passing logs later with
# `collector fill-logs` (D38, D42; docs/experts/build.md section 2.3).
member: build

